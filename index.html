<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetris — by Lo Studio</title>
<meta name="description" content="A retro 8-bit browser Tetris game. Keyboard and touch.">
<meta name="theme-color" content="#3B0FA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:title" content="Tetris — by Lo Studio">
<meta property="og:description" content="A retro 8-bit browser Tetris game.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%233B0FA8'/%3E%3Crect x='2' y='3' width='5' height='5' fill='%232ED9FF'/%3E%3Crect x='7' y='3' width='5' height='5' fill='%23FFE14D'/%3E%3Crect x='2' y='8' width='5' height='5' fill='%23FF4D6D'/%3E%3Crect x='7' y='8' width='5' height='5' fill='%234DFF88'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #1B0E4E; color: #F4F4F4; font-family: 'Press Start 2P', monospace; }
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior: none; }
  button, canvas { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { image-rendering: pixelated; }
  a { color: #00E5FF; text-decoration: none; }
  a:hover { color: #7DF3FF; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }

  @keyframes lvlpulse { 0% { transform: scale(1); text-shadow: 0 0 0 rgba(0,229,255,0); } 30% { transform: scale(1.45); color: #00E5FF; text-shadow: 0 0 18px rgba(0,229,255,0.9); } 100% { transform: scale(1); text-shadow: 0 0 0 rgba(0,229,255,0); } }
  @keyframes ovfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ovpop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes neonbreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  .board-col { display: flex; flex-direction: column; gap: 10px; }
  .byline {
    text-align: right; font-size: 8px; letter-spacing: 0.16em; line-height: 1;
    color: rgba(255,255,255,0.4); text-shadow: 2px 2px 0 rgba(0,0,0,0.55);
  }
  .byline b { color: inherit; font-weight: normal; }

  .page {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 26px;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background-color: #7B2FF7;
    background-image:
      linear-gradient(rgba(255,255,255,0.07) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.07) 2px, transparent 2px),
      radial-gradient(700px 520px at 12% 8%, #2ED9FF 0%, rgba(0,0,0,0) 62%),
      radial-gradient(760px 560px at 90% 88%, #FF3EA5 0%, rgba(0,0,0,0) 62%),
      linear-gradient(160deg, #8A2BE2 0%, #6320E0 55%, #3B0FA8 100%);
    background-size: 32px 32px, 32px 32px, auto, auto, auto;
  }

  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand-word { display: flex; gap: 8px; }
  .brand-word span {
    font-size: 38px; line-height: 1; color: #FFFFFF;
    -webkit-text-stroke: 4px #12052E; paint-order: stroke fill;
    text-shadow: 5px 5px 0 #12052E, 5px 0 0 #12052E, 0 5px 0 #12052E;
  }
  .brand-word span:nth-child(1) { color: #2ED9FF; }
  .brand-word span:nth-child(2) { color: #FFE14D; }
  .brand-word span:nth-child(3) { color: #4DFF88; }
  .brand-word span:nth-child(4) { color: #FF4D6D; }
  .brand-word span:nth-child(5) { color: #FF9E3D; }
  .brand-word span:nth-child(6) { color: #FFFFFF; }
  .brand-mark { display: grid; grid-template-columns: repeat(6, 12px); grid-template-rows: repeat(2, 12px); gap: 3px; }
  .brand-mark i { background: currentColor; box-shadow: inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.45); }
  .brand-tag { font-size: 9px; letter-spacing: 0.18em; color: #E6DBFF; text-shadow: 2px 2px 0 #12052E; }

  .layout { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; gap: 18px; width: 172px; }
  .panel {
    background: #12052E; border: 4px solid #12052E; outline: 4px solid rgba(255,255,255,0.22); border-radius: 0; padding: 14px;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
  }
  .label { font-size: 9px; letter-spacing: 0.12em; color: #2ED9FF; text-shadow: 2px 2px 0 #000; margin-bottom: 10px; }
  .controls-grid { display: grid; grid-template-columns: auto 1fr; gap: 9px 10px; font-size: 8px; line-height: 1.4; color: #B9A9E8; }
  .key { color: #FFE14D; }
  .mute-btn {
    background: #12052E; border: 4px solid rgba(255,255,255,0.22); border-radius: 0; padding: 12px 10px;
    color: #B9A9E8; font-size: 8px; letter-spacing: 0.08em; cursor: pointer; text-align: center;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
  }
  .mute-btn:hover { color: #FFE14D; border-color: #FFE14D; }
  .mute-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 rgba(0,0,0,0.35); }

  .board-wrap {
    position: relative; background: #12052E; border: 4px solid #12052E; outline: 4px solid rgba(255,255,255,0.3); border-radius: 0; padding: 10px;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.4);
  }
  .board-wrap { --cell: 32px; }
  #board { display: block; width: calc(var(--cell) * 10); height: calc(var(--cell) * 20); border-radius: 0; }

  .overlay { position: absolute; inset: 10px; border-radius: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; animation: ovfade 0.2s ease-out; }
  .overlay.show { display: flex; }
  #pauseOverlay { background: rgba(18,5,46,0.9); }
  #pauseOverlay .title { font-size: 22px; letter-spacing: 0.06em; color: #2ED9FF; text-shadow: 4px 4px 0 #000; animation: ovpop 0.25s ease-out; }
  #pauseOverlay .hint { font-size: 8px; line-height: 1.6; color: #B9A9E8; }
  #overOverlay { background: rgba(18,5,46,0.93); animation: ovfade 0.5s ease-out; }
  #overOverlay .title { font-size: 18px; letter-spacing: 0.04em; color: #FF4D6D; text-shadow: 4px 4px 0 #000; animation: ovpop 0.35s ease-out; text-align: center; }
  #overOverlay .final-score { font-size: 16px; color: #FFE14D; text-shadow: 3px 3px 0 #000; }
  #overOverlay .best-tag { display: none; font-size: 8px; letter-spacing: 0.1em; color: #4DFF88; text-shadow: 2px 2px 0 #000; animation: neonbreathe 0.9s steps(1) infinite; }
  #overOverlay .best-tag.show { display: block; }
  .play-again {
    margin-top: 10px; background: #FFE14D; border: none; border-radius: 0; padding: 12px 18px; color: #12052E;
    font-family: inherit; font-size: 9px; letter-spacing: 0.08em; cursor: pointer;
    box-shadow: 5px 5px 0 #12052E;
  }
  .play-again:hover { background: #FFF29A; }
  .play-again:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #12052E; }

  .stat-value { font-size: 18px; line-height: 1; color: #FFFFFF; text-shadow: 3px 3px 0 #000; }
  .stat-row { display: flex; gap: 18px; margin-top: 14px; }
  .stat-sub { font-size: 14px; line-height: 1; display: inline-block; transform-origin: left center; text-shadow: 2px 2px 0 #000; }
  .best-value { font-size: 11px; color: #B9A9E8; line-height: 1; text-shadow: 2px 2px 0 #000; }

  #hold, #next { display: block; }
  #hold { width: 140px; height: 70px; }
  #next { width: 140px; height: 330px; }

  .touch-row { width: 100%; display: none; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .touch-row.show { display: flex; }
  .touch-btn {
    background: #12052E; border: 4px solid rgba(255,255,255,0.22); border-radius: 0;
    min-width: 56px; min-height: 52px; color: #F4F4F4; font-size: 16px; cursor: pointer;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.35);
  }
  .touch-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 rgba(0,0,0,0.35); }
  .touch-btn.rotate { color: #2ED9FF; }
  .touch-btn.hold { font-size: 8px; }
  .touch-btn.drop {
    background: #FFE14D; border: 4px solid #FFE14D; min-width: 72px; color: #12052E; font-size: 8px;
  }

  /* ---------- tablets & phones ---------- */
  @media (max-width: 900px) {
    .page { gap: 16px; }
    .brand-word { gap: 5px; }
    .brand-word span { font-size: 28px; -webkit-text-stroke-width: 3px; text-shadow: 4px 4px 0 #12052E, 4px 0 0 #12052E, 0 4px 0 #12052E; }
    .layout { flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .board-wrap { --cell: max(22px, min(32px, (100vw - 72px) / 10, (100vh - 210px) / 20)); }
    .board-col { order: 1; align-items: center; }
    .touch-row { order: 2; }
    .col { order: 3; flex-direction: row; flex-wrap: wrap; align-items: stretch; width: 100%; max-width: 420px; gap: 10px; }
    .col.side-left { order: 4; }
    .panel { flex: 1 1 130px; padding: 10px; }
    #controlsPanel { display: none; }
    #hold, #next { width: 100%; height: auto; }
    #next { max-height: 150px; }
    .mute-btn { flex: 1 1 130px; padding: 14px 8px; }
    .byline { flex: 1 1 100%; text-align: center; }
    .stat-row { gap: 14px; margin-top: 10px; }
  }

  /* ---------- short / landscape screens ---------- */
  @media (max-height: 720px) and (min-width: 901px) {
    .page { gap: 14px; padding-top: 14px; }
    .brand-word span { font-size: 26px; }
  }

  @media (max-width: 380px) {
    .brand-word span { font-size: 22px; -webkit-text-stroke-width: 3px; }
    .touch-btn { min-width: 46px; min-height: 48px; }
    .touch-btn.drop { min-width: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="brand-word">
      <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
    </div>
  </div>
  <div class="layout">

    <div class="col side-left">
      <div class="panel">
        <div class="label">HOLD</div>
        <canvas id="hold" width="140" height="70"></canvas>
      </div>
      <div class="panel" id="controlsPanel">
        <div class="label">CONTROLS</div>
        <div class="controls-grid">
          <span class="key">&larr; &rarr;</span><span>Move</span>
          <span class="key">&darr;</span><span>Soft drop</span>
          <span class="key">Space</span><span>Hard drop</span>
          <span class="key">Z / X</span><span>Rotate</span>
          <span class="key">C</span><span>Hold</span>
          <span class="key">P</span><span>Pause</span>
          <span class="key">R</span><span>Restart</span>
          <span class="key">N</span><span>Music</span>
        </div>
      </div>
      <button class="mute-btn" id="muteBtn">SOUND: ON (M)</button>
      <button class="mute-btn" id="musicBtn">MUSIC: ON (N)</button>
    </div>

    <div class="board-col">
    <div class="board-wrap">
      <canvas id="board" width="320" height="640"></canvas>
      <div class="overlay" id="pauseOverlay">
        <div class="title">PAUSED</div>
        <div class="hint">Press <span class="key">P</span> to resume</div>
      </div>
      <div class="overlay" id="overOverlay">
        <div class="title">GAME OVER</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="best-tag" id="bestTag">NEW HIGH SCORE</div>
        <button class="play-again" id="playAgainBtn">PLAY AGAIN</button>
      </div>
    </div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="label">SCORE</div>
        <div class="stat-value" id="scoreVal">0</div>
        <div class="stat-row">
          <div>
            <div class="label" style="margin-bottom:4px">LEVEL</div>
            <div class="stat-sub" id="levelVal">1</div>
          </div>
          <div>
            <div class="label" style="margin-bottom:4px">LINES</div>
            <div class="stat-sub" id="linesVal">0</div>
          </div>
        </div>
        <div style="margin-top:14px">
          <div class="label" style="margin-bottom:4px">BEST</div>
          <div class="best-value" id="bestVal">0</div>
        </div>
      </div>
      <div class="panel">
        <div class="label">NEXT</div>
        <canvas id="next" width="140" height="330"></canvas>
      </div>
      <div class="byline">BY LO STUDIO</div>
    </div>

    <div class="touch-row" id="touchRow">
      <button class="touch-btn" id="tLeft">&larr;</button>
      <button class="touch-btn" id="tRight">&rarr;</button>
      <button class="touch-btn" id="tDown">&darr;</button>
      <button class="touch-btn rotate" id="tRotate">&#9083;</button>
      <button class="touch-btn hold" id="tHold">HOLD</button>
      <button class="touch-btn drop" id="tDrop">DROP</button>
    </div>
  </div>
</div>

<script src="tetris.js"></script>
</body>
</html>
